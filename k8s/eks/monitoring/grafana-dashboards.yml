# Provisioned Grafana dashboards for GPU (DCGM) and vLLM telemetry.
#
# The kube-prometheus-stack Grafana runs a sidecar that watches the `monitoring`
# namespace for ConfigMaps labelled `grafana_dashboard: "1"` and loads each data
# key as a dashboard — so these appear automatically, no manual import, and
# survive a redeploy. Stock kube-prometheus-stack ignores the folder annotation,
# so the dashboards land in the "General" folder (search "OCR" to find them).
#
# Every panel/target references the datasource via the `${datasource}` template
# variable (type: datasource, query: prometheus) so it binds to whatever the
# Prometheus datasource is named. All queries use metric names verified present
# on this cluster (DCGM_FI_DEV_* from the exporter DaemonSet; vllm:* from vLLM).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gpu-dcgm.json: |
    {
      "uid": "ocr-gpu-dcgm",
      "title": "OCR — GPU (DCGM)",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "GPU Utilization",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "GPU Framebuffer Used",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "decmbytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_FB_USED",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "GPU Temperature",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "celsius" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_GPU_TEMP",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "GPU Power Usage",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "watt", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_POWER_USAGE",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "SM Clock",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "rothz", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_SM_CLOCK * 1000000",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory Copy Utilization",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "DCGM_FI_DEV_MEM_COPY_UTIL",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        }
      ]
    }
  vllm.json: |
    {
      "uid": "ocr-vllm",
      "title": "OCR — vLLM Inference",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests (running vs waiting)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(vllm:num_requests_running)", "legendFormat": "running" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(vllm:num_requests_waiting)", "legendFormat": "waiting" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "KV Cache Usage",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "vllm:kv_cache_usage_perc * 100", "legendFormat": "kv cache %" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Token Throughput",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:prompt_tokens_total[5m]))", "legendFormat": "prompt tok/s" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:generation_tokens_total[5m]))", "legendFormat": "generation tok/s" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Time To First Token (quantiles)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.50, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Inter-Token Latency (quantiles)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.50, sum(rate(vllm:inter_token_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:inter_token_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.99, sum(rate(vllm:inter_token_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Time Per Output Token (quantiles)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.50, sum(rate(vllm:request_time_per_output_token_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:request_time_per_output_token_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "End-to-End Inference Time (quantiles)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.50, sum(rate(vllm:request_inference_time_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:request_inference_time_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.99, sum(rate(vllm:request_inference_time_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Queue Time (quantiles)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.50, sum(rate(vllm:request_queue_time_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:request_queue_time_seconds_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.99, sum(rate(vllm:request_queue_time_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Prefill vs Decode Time (p95)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:request_prefill_time_seconds_bucket[5m])) by (le))", "legendFormat": "prefill p95" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "histogram_quantile(0.95, sum(rate(vllm:request_decode_time_seconds_bucket[5m])) by (le))", "legendFormat": "decode p95" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Waiting Requests by Reason",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum by (reason) (vllm:num_requests_waiting_by_reason)", "legendFormat": "{{reason}}" }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Prefix Cache Hit Rate",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "100 * sum(rate(vllm:prefix_cache_hits_total[5m])) / clamp_min(sum(rate(vllm:prefix_cache_queries_total[5m])), 1)", "legendFormat": "prefix hit %" }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Multimodal (Image) Cache Hit Rate",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "100 * sum(rate(vllm:mm_cache_hits_total[5m])) / clamp_min(sum(rate(vllm:mm_cache_queries_total[5m])), 1)", "legendFormat": "mm hit %" }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Cached Prompt Token Ratio",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "100 * sum(rate(vllm:prompt_tokens_cached_total[5m])) / clamp_min(sum(rate(vllm:prompt_tokens_total[5m])), 1)", "legendFormat": "cached prompt %" }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Avg Generation Tokens per Request",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:request_generation_tokens_sum[5m])) / clamp_min(sum(rate(vllm:request_generation_tokens_count[5m])), 1)", "legendFormat": "avg gen tokens" }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Avg Prompt Tokens per Request",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 56 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:request_prompt_tokens_sum[5m])) / clamp_min(sum(rate(vllm:request_prompt_tokens_count[5m])), 1)", "legendFormat": "avg prompt tokens" }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Avg Iteration Tokens (batch size)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 56 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:iteration_tokens_total_sum[5m])) / clamp_min(sum(rate(vllm:iteration_tokens_total_count[5m])), 1)", "legendFormat": "avg iteration tokens" }
          ]
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Success & Preemptions",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 64 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:request_success_total[5m]))", "legendFormat": "success/s" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(vllm:num_preemptions_total[5m]))", "legendFormat": "preemptions/s" }
          ]
        }
      ]
    }
