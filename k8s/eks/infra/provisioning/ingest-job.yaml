apiVersion: batch/v1
kind: Job
metadata:
  name: model-weight-ingest
  namespace: default
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ingestor
          image: python:3.11-slim
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "16Gi"
          env:
            - name: MODELS
              value: "PaddlePaddle/PP-DocLayoutV3_safetensors,Qwen/Qwen3.5-4B"
            - name: HF_HUB_DISABLE_DISK_SPACE_CHECK
              value: "1"
            - name: HF_HOME
              value: "/hf-cache"
            - name: HF_HUB_CACHE
              value: "/hf-cache/hub"
            - name: HF_TOKEN
              value: "" # User should provide this if needed for private models
          command: ["python3", "-c"]
          args:
            - |
              import os, time, sys, urllib.request, json, ssl

              models = os.getenv("MODELS").split(",")
              token = os.getenv("HF_TOKEN")
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE

              for model_id in models:
                  safe_id = model_id.replace("/", "__")
                  dest_dir = f"/mnt/models/{model_id}"
                  marker = f"/mnt/models/.ingested_{safe_id}"

                  if os.path.exists(marker):
                      print(f"✅ Marker found for {model_id}. Skipping.")
                      continue

                  print(f"🚀 Starting ingestion for {model_id}")
                  os.makedirs(dest_dir, exist_ok=True)

                  try:
                      api_url = f"https://huggingface.co/api/models/{model_id}"
                      req = urllib.request.Request(api_url)
                      if token: req.add_header("Authorization", f"Bearer {token}")

                      with urllib.request.urlopen(req, context=ctx) as response:
                          data = json.loads(response.read().decode())
                          files = [s["rfilename"] for s in data["siblings"]]

                      print(f"📦 Found {len(files)} files for {model_id}.")

                      for i, filename in enumerate(files):
                          url = f"https://huggingface.co/{model_id}/resolve/main/{filename}"
                          local_path = os.path.join(dest_dir, filename)
                          os.makedirs(os.path.dirname(local_path), exist_ok=True)

                          if os.path.exists(local_path):
                              print(f"  [{i+1}/{len(files)}] {filename} already exists... [SKIPPED]")
                              continue

                          print(f"  [{i+1}/{len(files)}] {filename}...", end="", flush=True)
                          for attempt in range(3):
                              try:
                                  file_req = urllib.request.Request(url)
                                  if token: file_req.add_header("Authorization", f"Bearer {token}")
                                  with urllib.request.urlopen(file_req, context=ctx) as r, open(local_path, "wb") as f:
                                      while True:
                                          chunk = r.read(1024 * 1024)
                                          if not chunk: break
                                          f.write(chunk)
                                  print(" [DONE]")
                                  break
                              except Exception as e:
                                  if attempt == 2: raise e
                                  print(f" [RETRY {attempt+1}]", end="", flush=True)
                                  time.sleep(5)

                      with open(marker, "w") as f:
                          f.write(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()))
                      print(f"✅ Ingestion complete for {model_id}")

                  except Exception as e:
                      print(f"\n❌ Fatal Error for {model_id}: {e}")
                      sys.exit(1)
          volumeMounts:
            - name: model-weights
              mountPath: /mnt/models
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
        - name: hf-cache
          emptyDir: {}
