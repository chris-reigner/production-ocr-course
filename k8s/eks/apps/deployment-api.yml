apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-api-deployment
  labels:
    app: ocr-api
spec:
  replicas: 1 # Lightweight Rust API on Redis node pool
  selector:
    matchLabels:
      app: ocr-api
  template:
    metadata:
      labels:
        app: ocr-api
    spec:
      nodeSelector:
        app: api-gateway
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
      containers:
        - name: ocr-api-rust
          image: ocr-api-rust:latest # registry injected by kustomize images: transformer
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker-rt-deployment
  labels:
    app: ocr-worker-rt
spec:
  replicas: 0 # KEDA scales this on T4 nodes
  selector:
    matchLabels:
      app: ocr-worker-rt
  template:
    metadata:
      labels:
        app: ocr-worker-rt
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: gpunpt4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
      containers:
        - name: ocr-worker-rt-python
          image: ocr-worker-rt:latest # registry injected by kustomize images: transformer
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: dshm
              mountPath: "/dev/shm"
            - name: model-weights
              mountPath: "/mnt/models"
              readOnly: true
