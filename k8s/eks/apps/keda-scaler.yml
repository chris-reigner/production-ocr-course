apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-worker-rt-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-worker-rt-deployment
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    # 1. Warm-start during business hours (Europe/Berlin)
    - type: cron
      metadata:
        timezone: Europe/Berlin
        start: 0 9 * * 1-5
        end: 0 20 * * 1-5
        desiredReplicas: "1"
    # 2. Aggressive scaling based on Redis Queue Length (T4 Worker)
    - type: redis
      metadata:
        address: ocr-redis-service.default.svc.cluster.local:6379
        listName: ocr_tasks
        listLength: "1" # Scale 1 worker for EVERY task in queue
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-vlm-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-vlm-deployment
  minReplicaCount: 0
  maxReplicaCount: 4
  cooldownPeriod: 300 # Shorter cooldown for faster reallocation
  pollingInterval: 10 # More frequent polling
  triggers:
    # 1. Warm-start during business hours
    - type: cron
      metadata:
        timezone: Europe/Berlin
        start: 0 9 * * 1-5
        end: 0 20 * * 1-5
        desiredReplicas: "1"
    # 2. Aggressive scaling based on vLLM Queue Depth (A100)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: vllm_num_requests_waiting
        threshold: '1' # Scale if even ONE request is waiting in queue
        # No namespace filter: there is a single vLLM deployment, and the
        # prometheus-operator labels the scraped series `namespace` (not
        # `kubernetes_namespace`), so an explicit filter would silently match
        # nothing. Add {namespace="default"} back only if you run vLLM elsewhere.
        query: sum(vllm:num_requests_waiting)
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-api-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-api-deployment
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
